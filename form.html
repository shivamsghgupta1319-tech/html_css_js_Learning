<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Basics</title>
</head>
<body>
    <h2>Form Basics</h2>
    
    <form action="#" method="post">

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required placeholder="Enter your name">

        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required placeholder="Enter your mail">

        <br><br>
        <label for="phone">Phone number:</label>
        <input type="tel" name="phone" id="phone" required placeholder="Enter your phone  number">
        
        <br><br>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" required min="18" max="60">
  
        <br><br>


        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" required placeholde="Enter your password">
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
