<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <style>
        /* img{
            filter: blur(10px);
        }*/
        .img1 {
            filter: brightness(122%)  /*contrast(200%) invert(0.2)  opacity(0)(opacity se gyb hom jati h img agr 0 kiya to img gayab agr badhayaa point me to img gadhi hoti jati h)*/
            
            
        }

        .img2 {
            filter: grayscale(100%);
           /* filter: sepia(100%);*/
          /* filter: invert(1);*/
        }

        .img3 {
            filter: opacity(0.2);
        }
    </style>
</head>

<body>
    <div class="container">

            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdCsba8fdpR_M6smdP6mhnZXzIgzilu_QlnahHgCUqDbLDtm2my9SL2PGYYbSvmOMAt83ezZj8_BWEDOu4fYBg9v-XK3YayLgOLIsjSTmoIA&s=10"
            alt="sharukh khan">
        <br><br>

        <img class="img2"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9fsHm1MEqBrYK-yUgs7GIt4Cv6-E2DrejXVC_h4QDwg&s=10"
            alt="akshay kumar">
        <br><br>
        <img class="img3"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnTiSHt843m6JAv1Vu4481qP-8XkW9lrjdi1LaTFOREQ&s=10"
